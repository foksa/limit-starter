<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Usage Window Starter</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <header>
        <button type="button" class="icon-btn" data-action="settings" title="Settings…">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm6.3 3.6-1.2.7a5 5 0 0 1-.4 1l.4 1.3-1.5 1.5-1.3-.4a5 5 0 0 1-1 .4l-.7 1.2H6.4l-.7-1.2a5 5 0 0 1-1-.4l-1.3.4-1.5-1.5.4-1.3a5 5 0 0 1-.4-1l-1.2-.7V6.9l1.2-.7a5 5 0 0 1 .4-1l-.4-1.3 1.5-1.5 1.3.4a5 5 0 0 1 1-.4l.7-1.2h2.2l.7 1.2a5 5 0 0 1 1 .4l1.3-.4 1.5 1.5-.4 1.3a5 5 0 0 1 .4 1l1.2.7v2.2Z" /></svg>
        </button>
        <h1>Usage Window Starter</h1>
        <button type="button" class="icon-btn" id="check" data-action="check" title="Check now">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M12.5 1.5v3h-3" /></svg>
        </button>
      </header>

      <p class="banner" id="resting" hidden></p>

      <ul class="list" id="providers"></ul>

      <hr />

      <ul class="list">
        <li>
          <label class="row">
            <span class="glyph"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5-7-4.5Z" /></svg></span>
            <span class="grow">Auto-start 5h sessions</span>
            <input type="checkbox" class="switch" id="autoStart" />
          </label>
        </li>
        <li id="update-row">
          <button type="button" class="row" id="update">
            <span class="glyph"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13.5h10" /></svg></span>
            <span class="grow" id="update-label">Check for updates…</span>
            <span class="version" id="version"></span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-action="log">
            <span class="glyph"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h5.5L12 5v8.5H4v-11ZM6 7.5h4M6 10h4" /></svg></span>
            <span class="grow">Open log</span>
          </button>
        </li>
        <li>
          <button type="button" class="row" data-action="quit">
            <span class="glyph"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v5.5M4.8 4.2a5 5 0 1 0 6.4 0" /></svg></span>
            <span class="grow">Quit</span>
          </button>
        </li>
      </ul>
    </div>
    <script src="index.js"></script>
  </body>
</html>
